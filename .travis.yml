sudo: required
dist: focal
services:
  - docker

language: go

go:
  - 1.24.x

os:
  - linux
  - osx

env:
  matrix:
    - TARGETS="check"
    - TARGETS="testsuite"

  global:
    # Cross-compile for amd64 only to speed up testing.
    - GOX_FLAGS="-arch amd64"
    - MACOSX_DEPLOYMENT_TARGET=10.15

addons:
  apt:
    update: true

before_install:
  - umask 022

install:
  - true

script:
  - make $TARGETS

after_success:
  # Copy full.cov to coverage.txt because codecov.io requires this file
